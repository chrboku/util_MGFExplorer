[project]
name = "util-mgfexplorer"
version = "0.32.0"
description = "A GUI tool for exploring and editing MGF (Mascot Generic Format) files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.5.0",
    "rdkit>=2025.3.5",
    "pillow>=8.0.0",
    "pyqt6>=6.6.0",
]

[project.scripts]
mgfexplorer = "mgfexplorer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgfexplorer"]
