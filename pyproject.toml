[project]
name = "MSMSExplorer"
version = "1.0.0"
description = "A GUI tool for exploring and editing MGF (Mascot Generic Format) and JSON MSMS files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.5.0",
    "rdkit>=2025.3.5",
    "pillow>=8.0.0",
    "tkinterdnd2>=0.3.0",
    "pyperclip>=1.11.0",
]

[project.scripts]
MSMSExplorer = "msmsexplorer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msmsexplorer"]
